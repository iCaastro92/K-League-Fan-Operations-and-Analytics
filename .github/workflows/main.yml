name: K-League CRM Churn Prediction Automation

on:
  schedule:
    # Runs every Monday at 08:00 AM (UTC)
    # Note: GitHub Actions uses UTC. Adjust the hour if your target time zone is different.
    - cron: '0 8 * * 1'
  
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  run-churn-automation:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Bring your repository files into the empty virtual machine
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up the Python environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # Step 3: Install the required libraries
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests

      # Step 4: Execute the Python script
      - name: Run CRM Webhook Script
        env:
          # Injects the GitHub Secret into the script as an environment variable
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          python scripts/trigger_crm_campaign.py